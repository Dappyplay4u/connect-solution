stages:
  - build
  - deploy
  - destroy
  - upload

include:
  - component: $CI_SERVER_FQDN/ops/cloud-engineering/cloud-infra-eng/iac-pipeline-utilities/tf-deploy@v0
    inputs:
      sdlc_env_name:       dev-ue1
      region:              us-west-2
      tfvars_file:         "examples/dynamodb/example.tfvars"
      oidc_role_arn:       arn:aws:iam::562755251363:role/auth-appid33003416-nonprod-deploy-role
      oidc_target_account: "915293181670"
      plan_rules:          [ { when: on_success } ]
      apply_rules:         [ { when: manual } ]
      stop_rules:          [ { when: never } ]

# ---------------------------------------------------------------------------
# Upload CSV files to S3 → triggers Lambda → loads into DynamoDB
#
# Folder structure must match the table keys in examples/dynamodb/main.tf:
#   examples/dynamodb/data/<table-key>/your-file.csv
#
# Examples:
#   examples/dynamodb/data/agent-configurations/agents.csv
#   examples/dynamodb/data/DNIS-mapping/dnis.csv
#   examples/dynamodb/data/office-hours/office-hours.csv
#   examples/dynamodb/data/prompts/prompts.csv
#
# Runs only on main when any CSV under examples/dynamodb/data/ changes.
# ---------------------------------------------------------------------------

upload_csv:
  image: amazon/aws-cli:2
  stage: upload
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://trgl.gitlab-dedicated.com
  variables:
    AWS_ROLE_ARN:                arn:aws:iam::562755251363:role/auth-appid33003416-nonprod-deploy-role
    AWS_WEB_IDENTITY_TOKEN_FILE: /tmp/oidc_token
    AWS_ROLE_SESSION_NAME:       gitlab-csv-upload-$CI_PIPELINE_ID
  script:
    - echo "$GITLAB_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
    - |
      echo "Uploading CSV files to s3://$CSV_BUCKET_NAME/"
      uploaded=0
      for dir in examples/dynamodb/data/*/; do
        table_key=$(basename "$dir")
        for csv_file in "$dir"*.csv; do
          [ -f "$csv_file" ] || continue
          dest="s3://$CSV_BUCKET_NAME/$table_key/$(basename "$csv_file")"
          echo "  → $csv_file to $dest"
          aws s3 cp "$csv_file" "$dest"
          uploaded=$((uploaded + 1))
        done
      done
      echo "Done — ${uploaded} file(s) uploaded."
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - examples/dynamodb/data/**/*.csv
